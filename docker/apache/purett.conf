ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "(^|/)\.">
        Require all denied
    </DirectoryMatch>

    <LocationMatch "(?i)^/wordpress(?:/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog /var/www/app/var/log/apache-error.log
    CustomLog /var/www/app/var/log/apache-access.log combined
</VirtualHost>
